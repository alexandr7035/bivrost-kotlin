apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: 'maven-publish'

dependencies {
    implementation project(':bivrost-utils')
    implementation project(':bivrost-solidity-types')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$versions.kotlin"

    implementation "com.squareup.moshi:moshi:$versions.moshi"
    implementation "com.squareup.moshi:moshi-kotlin:$versions.moshi"
    implementation "com.squareup:kotlinpoet:$versions.kotlinPoet"
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.78.1'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

task sourcesJar(type: Jar, dependsOn: classes) {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact sourcesJar
        }
    }
    repositories {
        mavenLocal()
        maven {
            url = uri('../repo')
        }
    }
}
